[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "identirl"
version = "0.1.0"
description = "Diagnosing reward misspecification and observation insufficiency in RL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.0,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
identirl = "identirl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["identirl*"]
